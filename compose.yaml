name: entra-relationship-explorer

x-app-environment: &app-environment
  NODE_ENV: production
  HOSTNAME: 0.0.0.0
  PORT: "3200"
  ENTRA_ENABLE_LIVE: "true"
  ENTRA_ALLOW_LOCAL_CLIENT_SECRET: "true"
  ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Set ENTRA_TENANT_ID to your own tenant GUID}
  ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:?Set ENTRA_CLIENT_ID to your own app registration GUID}
  ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:?Retrieve ENTRA_CLIENT_SECRET from Key Vault}
  ENTRA_REDIRECT_URI: http://127.0.0.1:3200/api/auth/callback
  ENTRA_OPTIONAL_GRAPH_SCOPES: ${ENTRA_OPTIONAL_GRAPH_SCOPES:-}
  ENTRA_DATA_ENCRYPTION_KEY: ${ENTRA_DATA_ENCRYPTION_KEY:?Retrieve ENTRA_DATA_ENCRYPTION_KEY from Key Vault}
  DATABASE_URL: postgresql://entra:${POSTGRES_PASSWORD_URL_ENCODED:?URL-encode POSTGRES_PASSWORD}@postgres:5432/entra_explorer

x-app-image: &app-image
  image: entra-relationship-explorer-app:local
  build: .

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: entra_explorer
      POSTGRES_USER: entra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Retrieve POSTGRES_PASSWORD from Key Vault}
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - entra_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entra -d entra_explorer"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *app-image
    environment: *app-environment
    working_dir: /app/apps/web
    command: ["--import", "tsx", "migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  web:
    <<: *app-image
    restart: unless-stopped
    environment: *app-environment
    working_dir: /app/standalone/apps/web
    command: ["server.js"]
    ports:
      - "127.0.0.1:3200:3200"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3200/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
    security_opt:
      - no-new-privileges:true

  worker:
    <<: *app-image
    restart: unless-stopped
    environment: *app-environment
    working_dir: /app/apps/web
    command: ["--import", "tsx", "worker.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

volumes:
  entra_postgres:
