name: Product verification

# PostgreSQL uses Docker Official Images on ECR Public to avoid Docker Hub
# anonymous pull quotas on shared runners. Keep the verified upstream digest.
# Actions are pinned to commit SHAs rather than tags. A tag can be moved to
# point at different code; a SHA cannot. The trailing comment records the
# human-readable version so updates stay reviewable.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: entra_test
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: entra_review_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U entra_test -d entra_review_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://entra_test:synthetic-test-only@127.0.0.1:5432/entra_review_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.23.0
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser for product checks
        run: pnpm --filter @entra-explorer/web exec playwright install --with-deps chromium

      - name: Audit runtime and development dependencies
        run: pnpm security:dependencies

      - name: Type-check, test, and build
        run: pnpm run verify

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: entra_test
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: entra_review_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U entra_test -d entra_review_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://entra_test:synthetic-test-only@127.0.0.1:5432/entra_review_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.23.0
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Coverage and maintainability gate
        run: pnpm quality:crap

  mutation:
    name: Mutation (${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        package: [domain, backend, engine, graph, web]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: entra_test
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: entra_review_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U entra_test -d entra_review_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://entra_test:synthetic-test-only@127.0.0.1:5432/entra_review_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.23.0
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate mutation runner
        run: pnpm test:mutation:runner

      - name: Fresh package mutation gate (95%)
        # Separate runners retain all tests and isolated PostgreSQL evidence.
        # Suppress repetitive per-mutant summaries, not mutation reports.
        run: env -u GITHUB_STEP_SUMMARY pnpm --filter @entra-explorer/${{ matrix.package }} test:mutation --force --concurrency 2

  quality:
    needs: [coverage, mutation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require coverage and every mutation package
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
        run: test "$COVERAGE_RESULT" = success && test "$MUTATION_RESULT" = success
