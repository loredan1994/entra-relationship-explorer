version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request per ecosystem area keeps review load sane on a
      # solo-maintained project. Security updates still arrive individually.
      development-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      production-patches:
        dependency-type: production
        update-types: ["patch"]
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
