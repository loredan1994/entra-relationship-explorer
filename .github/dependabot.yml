version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Build, CI and production use Node 24. Move declarations with the runtime.
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      vitest-toolchain:
        patterns: ["vitest", "@vitest/*"]
      # One pull request per ecosystem area keeps review load sane on a
      # solo-maintained project. Security updates still arrive individually.
      development-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      production-patches:
        dependency-type: production
        update-types: ["patch"]
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      codeql-actions:
        patterns: ["github/codeql-action/*"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # A runtime-major migration must update build, distroless and CI together.
      - dependency-name: "node"
        versions: [">=25"]
    commit-message:
      prefix: "chore"
