env:
  contexts:
    - name: local-read-only-api
      urls:
        - http://web:3200
      includePaths:
        - http://web:3200/api/v1/(health|session)
      excludePaths:
        - http://web:3200/api/(auth|scans|export).*
  parameters:
    failOnError: true
    failOnWarning: false
    continueOnFailure: false
    progressToStdout: true

jobs:
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 25
      scanOnlyInScope: true
  - type: requestor
    parameters: {}
    requests:
      - name: Unauthenticated health check
        url: http://web:3200/api/v1/health
        method: GET
        responseCode: 200
      - name: Unauthenticated session shape
        url: http://web:3200/api/v1/session
        method: GET
        responseCode: 200
  - type: passiveScan-wait
    parameters:
      maxDuration: 2
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: zap-passive.json
      reportTitle: Entra Relationship Explorer passive local API report
      reportDescription: Two unauthenticated GET requests only. No spider, authentication, fuzzing, or active scan.
      displayReport: false
    risks: [high, medium, low, info]
    confidences: [high, medium, low, falsepositive]
    sites:
      - http://web:3200
