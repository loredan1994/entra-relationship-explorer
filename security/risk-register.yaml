      "title": "Tenant and timing metadata remain plaintext database indexes",
      "severity": "low",
      "rationale": "Payloads are authenticated-encrypted, but tenant IDs, record IDs, statuses, and timestamps remain queryable so the durable worker can isolate and schedule work.",
      "affected_assets": ["da-tenant-session", "da-tenant-snapshot", "da-scan-jobs", "da-audit-records"],
      "trust_boundaries": ["tb-compose-network", "tb-persistent-storage"],
      "owner": "product-owner",
      "approver": null,
      "mitigation": "Keep PostgreSQL local, credential protected, and loopback/container bound; minimize metadata; encrypt all sensitive payload columns; establish retention and deletion operations before shared deployment.",
