    {
      "id": "risk-001",
      "title": "Local Docker administrators can inspect runtime secret material",
      "severity": "medium",
      "rationale": "The client secret, database password, and encryption key are retrieved from Key Vault but are injected into local container environments. A user with Docker-host administration can inspect process or container state.",
      "affected_assets": ["da-app-credential", "da-database-credential", "da-encryption-key", "da-msal-material"],
      "trust_boundaries": ["tb-docker-host", "tb-key-vault"],
      "owner": "product-owner",
      "approver": null,
      "mitigation": "Keep the stack single-user and local; retrieve secrets just in time; never write them to Git or generated reports; move to workload identity or mounted secret files before shared hosting.",
      "verification_evidence": ["scripts/compose-live.sh", "docs/LOCAL_OPERATIONS.md", "security/invariants/evidence.yaml#inv-12"],
      "status": "open",
      "tracking_issue": null,
      "expiry_date": null
    },
    {
      "id": "risk-002",
      "title": "CSV exports leave the managed application boundary",
      "severity": "medium",
      "rationale": "An authenticated operator can explicitly download an export containing directory identifiers and relationship data. The destination filesystem and later sharing are outside application control.",
      "affected_assets": ["da-csv-export", "da-tenant-snapshot"],
      "trust_boundaries": ["tb-export", "tb-operator-device"],
      "owner": "product-owner",
      "approver": null,
      "mitigation": "Require an authenticated tenant-bound session, use an explicit download action, set no-store, neutralize spreadsheet formulas, record the export access, and document safe handling.",
      "verification_evidence": ["apps/web/app/api/export/relationships.csv/route.ts", "apps/web/server/csv.test.ts", "packages/backend/src/backend.test.ts"],
      "status": "in-progress",
      "tracking_issue": null,
      "expiry_date": null
    },
    {
