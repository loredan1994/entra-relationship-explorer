threagile_version: 1.0.0

title: Entra Relationship Explorer - local read-only architecture
date: 2026-08-26
author:
  name: Product owner
  homepage: localhost

management_summary_comment: >
  Canonical threat-model-as-code for the local Entra Relationship Explorer. The integration is strictly read-only.
  The only Microsoft Graph flow is df-07 and it is HTTPS GET-only with Application.Read.All and Directory.Read.All.
business_criticality: important

business_overview:
  description: >
    A local operator inspects configured Microsoft Entra application relationships and compares tenant snapshots.
    Configured permission does not mean observed use. CSV export is explicit and leaves the managed boundary.
  images:

technical_overview:
  description: >
    A loopback browser talks to a Next.js container. PostgreSQL persists encrypted sessions and tenant snapshots.
    A durable worker is the sole Microsoft Graph client. A one-shot migration container changes only the local schema.
  images:

questions:
  How will runtime secrets be removed from container environment inspection before shared hosting?: "Owner decision required; use workload identity or mounted secret files."
  What retention and subject-rights policy applies before broader organizational use?: "Owner and privacy review required."
  Will loopback HTTP be replaced by local TLS before a non-local deployment?: "Yes; current exception is local-only."

abuse_cases:
  thr-001: Introduce a Microsoft Graph write scope or non-GET transport and mutate the tenant.
  thr-002: Use a session or object identifier to cross a tenant boundary and disclose another tenant's data.
  thr-003: Replay or substitute OAuth state, code, PKCE material, or tenant context.
  thr-004: Update or finish a durable job from a worker that did not claim it.
  thr-005: Follow a Microsoft Graph nextLink to an attacker origin or unreviewed API version.
  thr-006: Exhaust Graph or local resources through throttling, unbounded paging, retries, or concurrency and hide partial results.
  thr-007: Leak secrets, tokens, keys, raw Graph responses, or tenant exports through APIs, logs, reports, or Git.
  thr-008: Swap or tamper with encrypted session or snapshot ciphertext across records or tenants.
  thr-009: Execute spreadsheet formulas or disclose relationship data after explicit CSV export.
  thr-010: Present configured grants as observed API activity or present an incomplete scan as complete.
  thr-011: Use Docker-host administration or host compromise to inspect runtime secrets or the persistent volume.

security_requirements:
  Strictly read-only Microsoft Graph: df-07 must remain HTTPS GET-only and every requested Graph scope must be in the reviewed read-only allowlist.
  Tenant isolation: Every session, job, snapshot, access event, encryption context, and query belongs to exactly one concrete tenant.
  Explainability: Every graph relationship retains object IDs, type, source endpoint, source record IDs, scan time, and completeness.
  Secret exclusion: Credentials, tokens, encryption keys, raw Graph bodies, and tenant exports never enter Git or generated reports.
  Partial-result honesty: Failed or unavailable endpoints produce an explicit partial snapshot and safe error code.

tags_available:
  - read-only
  - local-only
  - docker
  - microsoft-entra
  - microsoft-graph
  - postgresql
  - azure-key-vault
  - pii
  - credentials
  - encrypted-at-rest
  - explicit-export

data_assets:
  OAuth Flow Material:
    id: da-oauth-flow
    description: Flow ID, tenant ID, PKCE verifier, state, and expiry.
    usage: business
    tags: [credentials, encrypted-at-rest]
    origin: ta-web
    owner: product-owner
    quantity: few
    confidentiality: strictly-confidential
    integrity: critical
    availability: operational
    justification_cia_rating: Replay or substitution could bind the wrong authorization transaction.
  MSAL Material:
    id: da-msal-material
    description: Delegated access token, MSAL token cache, and account information.
    usage: business
    tags: [credentials, encrypted-at-rest]
    origin: ta-ms-identity
    owner: product-owner
    quantity: few
    confidentiality: strictly-confidential
    integrity: critical
    availability: important
    justification_cia_rating: Disclosure grants delegated read access until expiry and enables refresh.
  Application Credential:
    id: da-app-credential
    description: Local app-registration client secret retrieved from Azure Key Vault.
    usage: devops
    tags: [credentials]
    origin: ta-key-vault
    owner: product-owner
    quantity: very-few
    confidentiality: strictly-confidential
    integrity: critical
    availability: important
    justification_cia_rating: The secret authenticates the local confidential client.
  Encryption Key:
    id: da-encryption-key
    description: 256-bit AES-GCM key retrieved from Azure Key Vault.
    usage: devops
    tags: [credentials]
    origin: ta-key-vault
    owner: product-owner
    quantity: very-few
    confidentiality: strictly-confidential
    integrity: mission-critical
    availability: important
    justification_cia_rating: Disclosure defeats snapshot and session confidentiality; corruption prevents recovery.
  Database Credential:
    id: da-database-credential
    description: Local PostgreSQL password retrieved from Azure Key Vault.
    usage: devops
    tags: [credentials]
    origin: ta-key-vault
    owner: product-owner
    quantity: very-few
    confidentiality: strictly-confidential
    integrity: critical
    availability: important
    justification_cia_rating: Disclosure permits local database access within the host boundary.
  Tenant Session:
    id: da-tenant-session
    description: Tenant-bound session ID, account, access token, cache, and expiries.
    usage: business
    tags: [credentials, encrypted-at-rest, pii]
    origin: ta-web
    owner: product-owner
    quantity: few
    confidentiality: strictly-confidential
    integrity: critical
    availability: important
    justification_cia_rating: Session compromise or tenant substitution can disclose tenant data.
  Tenant Snapshot:
    id: da-tenant-snapshot
    description: Normalized Entra objects, evidence, relationship graph, completion, and safe errors.
    usage: business
    tags: [encrypted-at-rest, pii]
    origin: ta-worker
    owner: product-owner
    quantity: many
    confidentiality: confidential
    integrity: critical
    availability: important
    justification_cia_rating: Snapshots reveal identities and organizational relationships and must remain explainable.
  Configured Permissions:
    id: da-permissions
    description: Configured app roles, assignments, delegated grants, and evidence. Does not represent observed activity.
    usage: business
    tags: [pii]
    origin: ta-ms-graph
    owner: tenant-owner
    quantity: many
    confidentiality: confidential
    integrity: critical
    availability: important
    justification_cia_rating: Misinterpretation or tampering can cause incorrect security decisions.
  Scan Jobs:
    id: da-scan-jobs
    description: Tenant, session reference, worker ownership, progress, result, and safe error status.
    usage: devops
    tags: [local-only]
    origin: ta-web
    owner: product-owner
    quantity: many
    confidentiality: restricted
    integrity: critical
    availability: important
    justification_cia_rating: Job ownership and state control which tenant data a worker processes.
  Audit Records:
    id: da-audit-records
    description: Tenant-scoped metadata-only access events without sensitive payload data.
    usage: devops
    tags: [pii]
    origin: ta-web
    owner: product-owner
    quantity: many
    confidentiality: restricted
    integrity: important
    availability: operational
    justification_cia_rating: Events support accountability but can also reveal operator behavior.
  CSV Export:
    id: da-csv-export
    description: Explicit relationship export crossing to the operator-controlled filesystem.
    usage: business
    tags: [pii, explicit-export]
    origin: ta-web
    owner: operator
    quantity: many
    confidentiality: confidential
    integrity: important
    availability: archive
    justification_cia_rating: Exports can be shared outside application controls and opened by spreadsheet interpreters.
  Graph Response:
    id: da-graph-response
    description: Transient Microsoft Graph v1.0 response. Raw bodies and secret-like fields are discarded.
    usage: business
    tags: [pii, read-only]
    origin: ta-ms-graph
    owner: tenant-owner
    quantity: many
    confidentiality: confidential
    integrity: important
    availability: operational
    justification_cia_rating: Raw responses contain directory identifiers but are not persisted.

